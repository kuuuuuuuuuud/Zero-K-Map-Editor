name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .[test]
      - name: Tests
        run: python -m pytest -q -n auto
      - name: Build an example map with the command line
        run: atlasforge procedural --title "CI Check" --size 4 4 --seed 1 --out out --author CI
